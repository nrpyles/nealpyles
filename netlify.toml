[build]
  publish = "."
  functions = "netlify/functions"

# Keep legacy site copies accessible without competing with the active pages in search.
[[headers]]
  for = "/nealpyles-site_3/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/nealpyles-site_4/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"


# The investor guide is now the main DSCR page.
[[redirects]]
  from = "/dscr-guide"
  to = "/dscr/"
  status = 301
  force = true

[[redirects]]
  from = "/dscr-guide/*"
  to = "/dscr/:splat"
  status = 301
  force = true
